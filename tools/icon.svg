<!--
  참고용 벡터 원본. 실제 배포되는 건 tools/make_icons.py가 만든 docs/icon-*.png뿐이다
  (런타임에 쓰지 않는 SVG를 서비스워커 캐시 목록에 넣지 않기 위해 docs/에는 두지 않는다).
  좌표는 make_icons.py의 pt(x, y) 좌표계(중심 기준 [-0.5, 0.5])를 그대로 512 캔버스에 옮긴 것.
-->
