  <rect x="20" y="20" width="472" height="472" rx="113" fill="#2E6C5A" />
  <rect x="123" y="128" width="266" height="256" rx="26" fill="#FFFFFF" />
  <rect x="123" y="199" width="266" height="14" rx="6" fill="#1F4E41" />
  <rect x="184" y="93" width="26" height="61" rx="13" fill="#1F4E41" />
  <rect x="302" y="93" width="26" height="61" rx="13" fill="#1F4E41" />
