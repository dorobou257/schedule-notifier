name: deploy-pages

# 화면(docs/)만 고쳤을 때 쓰는 배포 전용 워크플로.
#
# 이 저장소의 Pages는 브랜치에서 바로 서비스되는 게 아니라 워크플로가 docs/를
# 아티팩트로 올려 배포한다. 그래서 예전에는 master에 푸시해도 화면이 그대로였고,
# 다음 날 아침 daily-notify(외부 크론이 하루 한 번 깨우는)가 돌아야 반영됐다.
# 화면만 고쳤는데 노션을 다시 읽고 푸시 알림까지 태울 이유는 없으므로, 배포만
# 하는 워크플로를 따로 둔다.
#
# 자기 파일(.github/workflows/deploy-pages.yml)도 트리거 경로에 넣어 뒀다 —
# 이 워크플로를 고치는 푸시 역시 배포로 검증되는 편이 안전하다.

permissions:
  pages: write
  id-token: write

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

# daily-notify 도 Pages에 배포하므로 같은 그룹으로 묶어 동시 배포를 막는다.
# 진행 중인 배포를 취소하지는 않는다(취소하면 절반만 올라간 상태가 될 수 있다).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
