name: daily-notify

permissions:
  contents: read

on:
  # GitHub 자체 schedule 트리거는 정시(00분)에 지연/누락이 잦아
  # 외부 크론 서비스(cron-job.org)가 매일 08:00 KST에 이 workflow_dispatch를
  # 직접 호출하는 방식으로 대체했다. 자세한 내용은 README 참고.
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python notify.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SCHEDULE_DB_ID: ${{ secrets.SCHEDULE_DB_ID }}
          NOVEL_DB_ID: ${{ secrets.NOVEL_DB_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
