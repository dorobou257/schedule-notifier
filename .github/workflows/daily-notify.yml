name: daily-notify

permissions:
  contents: write # docs/today.json을 저장소에 커밋하기 위해 필요
  pages: write    # GitHub Pages에 직접 배포하기 위해 필요
  id-token: write # GitHub Pages 배포 인증에 필요

on:
  # GitHub 자체 schedule 트리거는 지연/누락이 잦아, 외부 크론 서비스
  # (cron-job.org)가 매일 아침 8시(KST) 1회 이 workflow_dispatch를 직접
  # 호출하는 방식을 쓴다. 화면(today.json) 갱신 + 하루 요약 푸시 알림을 겸한다.
  # 자세한 내용은 README 참고.
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python notify.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SCHEDULE_DB_ID: ${{ secrets.SCHEDULE_DB_ID }}
          NOVEL_DB_ID: ${{ secrets.NOVEL_DB_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: docs/today.json 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/today.json
          git diff --cached --quiet && echo "변경 없음, 커밋 생략" || git commit -m "오늘의 일정 갱신: $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
