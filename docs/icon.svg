<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="일정 알리미">
  <!-- 아이콘 원본. PNG(icon-*.png, apple-touch-icon.png)는 tools/make_icons.py 가
       이 좌표 그대로 그려서 만든다 — 여기를 고치면 스크립트의 상수도 같이 고칠 것.

       색은 검정과 흰색 둘뿐이다. 도안은 노션 [일정] 페이지의 캘린더 아이콘과 같은
       모양 — 위(헤더)는 채우고 아래는 속이 빈 선 그림. 참고지침 아이콘과 같은
       선 그림 방식이라 나란히 놓으면 한 벌로 보인다.

       그리는 방법: 몸체를 흰색으로 꽉 채운 뒤 아래쪽 속을 검정으로 도려낸다.
       흰 띠와 흰 테두리를 따로 그려 붙이면 둘이 만나는 자리에 한 픽셀짜리 계단이
       남는다(도형 두 개의 곡선 끝이 정확히 안 맞는다). 도려내는 사각형은 위쪽
       모서리만 각져야 헤더와 경계가 일직선이 된다. -->
  <rect width="24" height="24" rx="5.25" fill="#000000"/>

  <g fill="#FFFFFF">
    <!-- 스프링 바인더 링 두 개. 아래끝은 몸체에 묻혀 위로 솟은 부분만 보인다. -->
    <rect x="8.3" y="3.2" width="1.4" height="3.8" rx=".7"/>
    <rect x="14.3" y="3.2" width="1.4" height="3.8" rx=".7"/>
    <!-- 몸체 -->
    <rect x="3.6" y="6.5" width="16.8" height="14" rx="3"/>
  </g>

  <!-- 도려낸 속. 테두리 두께 1.4, 헤더 아래끝 9.9, 안쪽 반지름 = 3 - 1.4 = 1.6 -->
  <path d="M5 9.9 H19 V17.5 A1.6 1.6 0 0 1 17.4 19.1 H6.6 A1.6 1.6 0 0 1 5 17.5 Z"
        fill="#000000"/>
</svg>
