<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- 상태바 색은 페이지 배경과 같게 둔다(웹소설 트래커도 같은 방식). 액센트를
     쓰면 상태바만 색 띠로 남아 화면 위쪽이 잘린 것처럼 보인다. -->
<meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#17130F" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="stylesheet" href="./styles.css" />
<title>일정 알리미</title>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titles">
      <span class="eyebrow" id="date-label">일정 알리미</span>
      <h1 id="title">오늘 정리</h1>
      <span class="weekday" id="weekday-label"></span>
    </div>
    <div class="actions">
      <button id="settings-btn" class="icon-btn" aria-label="설정"></button>
      <button id="refresh-btn" class="icon-btn" aria-label="새로고침"></button>
    </div>
  </header>

  <main id="app">
    <p class="empty">불러오는 중…</p>
  </main>
  <div id="status"></div>
</div>

<div id="sheet-root"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
