<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2E6C5A" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<title>일정 알리미</title>
<style>
  :root{
    --bg:#F4F5EF;
    --surface:#FFFFFF;
    --surface-2:#ECEDE3;
    --ink:#1C2420;
    --muted:#5B655F;
    --faint:#8C948E;
    --rule:#DEDFD2;
    --pine:#2E6C5A;
    --pine-ink:#1F4E41;
    --pine-soft:rgba(46,108,90,.10);
    --red:#B23A2E;
    --red-soft:rgba(178,58,46,.09);
    --shadow:0 1px 2px rgba(28,36,32,.04), 0 6px 20px rgba(28,36,32,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141815; --surface:#1B211C; --surface-2:#232B24;
      --ink:#E7ECE7; --muted:#9BA79F; --faint:#6C766F; --rule:#28312A;
      --pine:#5CB89B; --pine-ink:#8CD9C0; --pine-soft:rgba(92,184,155,.14);
      --red:#E1786C; --red-soft:rgba(225,120,108,.13);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .mono{ font-family:"D2Coding","SF Mono","Consolas","Menlo",monospace; font-variant-numeric:tabular-nums; }

  .wrap{ max-width:520px; margin:0 auto; padding:0 0 36px; }

  header{
    padding:30px 20px 18px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  header .titles{ display:flex; flex-direction:column; gap:3px; }
  header .eyebrow{
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--pine); font-weight:800;
  }
  header h1{
    margin:0; font-size:25px; font-weight:800; letter-spacing:-.01em;
    text-wrap:balance;
  }
  header .weekday{ font-size:13.5px; color:var(--muted); font-weight:600; }
  #refresh{
    flex:none; width:38px; height:38px; border-radius:50%;
    border:1px solid var(--rule); background:var(--surface); color:var(--muted);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:var(--shadow); transition:transform .5s ease, color .2s ease;
  }
  #refresh:active{ color:var(--pine); }
  #refresh.spin svg{ animation:spin .6s linear; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ #refresh.spin svg{ animation:none; } }

  main{ padding:2px 16px 8px; display:flex; flex-direction:column; gap:14px; }

  .banner{
    display:flex; align-items:center; gap:10px;
    background:var(--red-soft); color:var(--red); border:1px solid var(--red);
    border-radius:14px; padding:13px 16px; font-weight:700; font-size:14.5px;
  }
  .banner svg{ flex:none; }

  section.card{
    background:var(--surface); border:1px solid var(--rule); border-radius:16px;
    padding:6px 4px; box-shadow:var(--shadow);
    opacity:0; transform:translateY(6px);
    animation:rise .45s ease forwards;
  }
  section.card:nth-of-type(1){ animation-delay:.02s; }
  section.card:nth-of-type(2){ animation-delay:.08s; }
  section.card:nth-of-type(3){ animation-delay:.14s; }
  @keyframes rise{ to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ section.card{ opacity:1; transform:none; animation:none; } }

  .card-head{
    display:flex; align-items:center; gap:8px;
    padding:12px 14px 8px;
  }
  .card-head .icon{
    flex:none; width:26px; height:26px; border-radius:8px;
    background:var(--pine-soft); color:var(--pine-ink);
    display:flex; align-items:center; justify-content:center;
  }
  .card-head h2{
    margin:0; font-size:13.5px; font-weight:800; color:var(--ink);
  }
  .card-head .count{
    margin-left:auto; font-size:12px; color:var(--faint);
  }

  ul.rows{ margin:0; padding:0 6px 6px; list-style:none; }
  li.row{
    display:flex; align-items:flex-start; gap:10px;
    padding:9px 8px; border-radius:10px;
  }
  li.row + li.row{ border-top:1px solid var(--rule); }

  .chip-time{
    flex:none; min-width:52px; text-align:center;
    font-size:12.5px; font-weight:700; color:var(--pine-ink);
    background:var(--pine-soft); border-radius:8px; padding:4px 6px;
  }
  .chip-time.empty{ visibility:hidden; }

  .row-body{ display:flex; flex-direction:column; gap:3px; min-width:0; padding-top:2px; }
  .row-body .tags{ display:flex; gap:5px; flex-wrap:wrap; }
  .tag{
    font-size:11px; font-weight:700; color:var(--muted);
    background:var(--surface-2); border-radius:6px; padding:2px 6px;
  }
  .row-body .text{ font-size:15px; line-height:1.42; word-break:keep-all; }

  p.empty{ margin:0; padding:6px 14px 14px; color:var(--faint); font-size:14px; }

  #status{ text-align:center; color:var(--faint); font-size:12px; padding:10px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titles">
      <span class="eyebrow" id="date-label">일정 알리미</span>
      <h1 id="title">오늘 정리</h1>
      <span class="weekday" id="weekday-label"></span>
    </div>
    <button id="refresh" aria-label="새로고침">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" />
      </svg>
    </button>
  </header>

  <main id="app">
    <p class="empty">불러오는 중…</p>
  </main>
  <div id="status"></div>
</div>

<script>
const ICONS = {
  clock: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  check: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12.5 2.5 2.5 5-5"/></svg>',
  book: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  holiday: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.5c.35 0 .67.2.83.51l2.3 4.66 5.14.75a.93.93 0 0 1 .52 1.58l-3.72 3.63.88 5.12a.93.93 0 0 1-1.35.98L12 16.9l-4.6 2.42a.93.93 0 0 1-1.35-.98l.88-5.12-3.72-3.63a.93.93 0 0 1 .52-1.58l5.14-.75 2.3-4.66c.16-.31.48-.51.83-.51Z"/></svg>',
};

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  Object.assign(node, props);
  children.forEach((c) => node.appendChild(c));
  return node;
}

function row(item) {
  const li = el("li", { className: "row" });
  const timeText = (item.time || "").trim();
  li.appendChild(el("span", {
    className: "chip-time mono" + (timeText ? "" : " empty"),
    textContent: timeText || "--",
  }));

  const body = el("div", { className: "row-body" });
  if (item.tags && item.tags.filter(Boolean).length) {
    const tagsWrap = el("div", { className: "tags" });
    item.tags.filter(Boolean).forEach((t) => tagsWrap.appendChild(el("span", { className: "tag", textContent: t })));
    body.appendChild(tagsWrap);
  }
  body.appendChild(el("span", { className: "text", textContent: item.text || "" }));
  li.appendChild(body);
  return li;
}

function card(iconKey, title, items, count) {
  const section = el("section", { className: "card" });
  const head = el("div", { className: "card-head" });
  head.appendChild(el("span", { className: "icon", innerHTML: ICONS[iconKey] }));
  head.appendChild(el("h2", { textContent: title }));
  if (typeof count === "number") {
    head.appendChild(el("span", { className: "count", textContent: count + "건" }));
  }
  section.appendChild(head);

  if (items && items.length) {
    const ul = el("ul", { className: "rows" });
    items.forEach((it) => ul.appendChild(row(it)));
    section.appendChild(ul);
  } else {
    section.appendChild(el("p", { className: "empty", textContent: "등록된 항목이 없습니다." }));
  }
  return section;
}

function render(data) {
  document.getElementById("date-label").textContent = data.date || "일정 알리미";
  document.getElementById("title").textContent = "오늘 정리";
  document.getElementById("weekday-label").textContent = data.weekday || "";

  const app = document.getElementById("app");
  app.innerHTML = "";

  if (data.holiday_names && data.holiday_names.length) {
    const banner = el("div", { className: "banner" });
    banner.innerHTML = ICONS.holiday;
    banner.appendChild(el("span", { textContent: "오늘은 공휴일입니다: " + data.holiday_names.join(", ") }));
    app.appendChild(banner);
  }

  app.appendChild(card("clock", data.schedule_title || "오늘의 일정", data.schedule_items, data.schedule_items ? data.schedule_items.length : 0));

  if (data.todo_items && data.todo_items.length) {
    app.appendChild(card("check", "오늘의 할일", data.todo_items, data.todo_items.length));
  }

  app.appendChild(card("book", "오늘의 소설 일정", data.novel_items, data.novel_items ? data.novel_items.length : 0));
}

async function loadToday(isRefresh) {
  const btn = document.getElementById("refresh");
  const statusEl = document.getElementById("status");
  if (isRefresh) btn.classList.add("spin");
  try {
    const res = await fetch("./today.json?t=" + Date.now(), { cache: "no-store" });
    const data = await res.json();
    render(data);
    statusEl.textContent = "";
  } catch (e) {
    statusEl.textContent = "새 데이터를 불러오지 못했습니다. 이전 화면을 보여드립니다.";
  } finally {
    setTimeout(() => btn.classList.remove("spin"), 600);
  }
}

document.getElementById("refresh").addEventListener("click", () => loadToday(true));
loadToday(false);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js");
  });
}
</script>
</body>
</html>
