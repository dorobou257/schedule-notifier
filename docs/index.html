<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2E6C5A" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<title>일정 알리미</title>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function (OneSignal) {
    function showDebug(extra) {
      const el = document.getElementById("debug");
      if (!el) return;
      const lines = [
        "permission(Notification): " + (typeof Notification !== "undefined" ? Notification.permission : "n/a"),
        "permission(OneSignal): " + OneSignal.Notifications.permission,
        "optedIn: " + OneSignal.User.PushSubscription.optedIn,
        "subscription id: " + OneSignal.User.PushSubscription.id,
        "onesignalId: " + OneSignal.User.onesignalId,
        extra || "",
      ];
      el.textContent = lines.join("\n");
    }
    try {
      await OneSignal.init({
        appId: "9bf67400-2aa3-4c64-b5af-7a014ab0d6cd",
        serviceWorkerParam: { scope: "/schedule-notifier/" },
        serviceWorkerPath: "service-worker.js",
      });
      showDebug("init 완료");
      OneSignal.User.PushSubscription.addEventListener("change", () => showDebug("change 이벤트 발생"));
    } catch (e) {
      const el = document.getElementById("debug");
      if (el) el.textContent = "init 에러: " + (e && e.message ? e.message : String(e));
    }
  });
</script>
<style>
  :root{
    --bg:#F4F5EF;
    --surface:#FFFFFF;
    --surface-2:#ECEDE3;
    --ink:#1C2420;
    --muted:#5B655F;
    --faint:#8C948E;
    --rule:#DEDFD2;
    --pine:#2E6C5A;
    --pine-ink:#1F4E41;
    --pine-soft:rgba(46,108,90,.10);
    --red:#B23A2E;
    --red-soft:rgba(178,58,46,.09);
    --shadow:0 1px 2px rgba(28,36,32,.04), 0 6px 20px rgba(28,36,32,.06);
    color-scheme: light;

    --cat-slate-ink:#3D4759; --cat-slate-soft:rgba(100,110,130,.13);
    --cat-terracotta-ink:#7A3D1D; --cat-terracotta-soft:rgba(196,106,58,.14);
    --cat-violet-ink:#4A3580; --cat-violet-soft:rgba(124,92,196,.13);
    --cat-steelblue-ink:#264A73; --cat-steelblue-soft:rgba(58,110,168,.13);
    --cat-moss-ink:#4A5A22; --cat-moss-soft:rgba(122,140,60,.15);
    --cat-teal-ink:#1F5C54; --cat-teal-soft:rgba(58,140,130,.14);
    --cat-amber-ink:#7A5A16; --cat-amber-soft:rgba(196,150,58,.16);
    --cat-rose-ink:#7A3550; --cat-rose-soft:rgba(180,90,120,.14);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141815; --surface:#1B211C; --surface-2:#232B24;
      --ink:#E7ECE7; --muted:#9BA79F; --faint:#6C766F; --rule:#28312A;
      --pine:#5CB89B; --pine-ink:#8CD9C0; --pine-soft:rgba(92,184,155,.14);
      --red:#E1786C; --red-soft:rgba(225,120,108,.13);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;

      --cat-slate-ink:#B8C2D9; --cat-slate-soft:rgba(140,150,170,.18);
      --cat-terracotta-ink:#F0B48C; --cat-terracotta-soft:rgba(224,140,90,.18);
      --cat-violet-ink:#C9B8F0; --cat-violet-soft:rgba(160,130,224,.18);
      --cat-steelblue-ink:#A8CBF0; --cat-steelblue-soft:rgba(100,150,214,.18);
      --cat-moss-ink:#D0E0A0; --cat-moss-soft:rgba(160,180,100,.18);
      --cat-teal-ink:#9EE0D4; --cat-teal-soft:rgba(90,180,168,.18);
      --cat-amber-ink:#F0D2A0; --cat-amber-soft:rgba(224,180,90,.2);
      --cat-rose-ink:#F0B8D0; --cat-rose-soft:rgba(214,120,150,.18);
    }
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .mono{ font-family:"D2Coding","SF Mono","Consolas","Menlo",monospace; font-variant-numeric:tabular-nums; }

  .wrap{ max-width:520px; margin:0 auto; padding:0 0 36px; }

  header{
    padding:30px 20px 18px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  header .titles{ display:flex; flex-direction:column; gap:3px; }
  header .eyebrow{
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--pine); font-weight:800;
  }
  header h1{
    margin:0; font-size:25px; font-weight:800; letter-spacing:-.01em;
    text-wrap:balance;
  }
  header .weekday{ font-size:13.5px; color:var(--muted); font-weight:600; }
  #refresh{
    flex:none; width:38px; height:38px; border-radius:50%;
    border:1px solid var(--rule); background:var(--surface); color:var(--muted);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:var(--shadow); transition:transform .5s ease, color .2s ease;
  }
  #refresh:active{ color:var(--pine); }
  #refresh.spin svg{ animation:spin .6s linear; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ #refresh.spin svg{ animation:none; } }

  main{ padding:2px 16px 8px; display:flex; flex-direction:column; gap:14px; }

  .banner{
    display:flex; align-items:center; gap:10px;
    background:var(--red-soft); color:var(--red); border:1px solid var(--red);
    border-radius:14px; padding:13px 16px; font-weight:700; font-size:14.5px;
  }
  .banner svg{ flex:none; }

  section.card{
    background:var(--surface); border:1px solid var(--rule); border-radius:16px;
    padding:6px 4px; box-shadow:var(--shadow);
    opacity:0; transform:translateY(6px);
    animation:rise .45s ease forwards;
  }
  section.card:nth-of-type(1){ animation-delay:.02s; }
  section.card:nth-of-type(2){ animation-delay:.08s; }
  section.card:nth-of-type(3){ animation-delay:.14s; }
  @keyframes rise{ to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ section.card{ opacity:1; transform:none; animation:none; } }

  .card-head{
    display:flex; align-items:center; gap:8px;
    padding:12px 14px 8px;
  }
  .card-head .icon{
    flex:none; width:26px; height:26px; border-radius:8px;
    background:var(--pine-soft); color:var(--pine-ink);
    display:flex; align-items:center; justify-content:center;
  }
  .card-head h2{
    margin:0; font-size:13.5px; font-weight:800; color:var(--ink);
  }
  .card-head .count{
    margin-left:auto; font-size:12px; color:var(--faint);
  }

  ul.rows{ margin:0; padding:0 6px 6px; list-style:none; }
  li.row{
    display:flex; align-items:flex-start; gap:10px;
    padding:9px 8px; border-radius:10px;
  }
  li.row + li.row{ border-top:1px solid var(--rule); }

  .chip-time{
    flex:none; min-width:52px; text-align:center;
    font-size:12.5px; font-weight:700; color:var(--pine-ink);
    background:var(--pine-soft); border-radius:8px; padding:4px 6px;
  }
  .chip-time.empty{ visibility:hidden; }
  .chip-time[data-cat]{ color:var(--cat-ink); background:var(--cat-soft); }

  .row-body{ display:flex; flex-direction:column; gap:3px; min-width:0; padding-top:2px; }
  .row-body .tags{ display:flex; gap:5px; flex-wrap:wrap; }
  .tag{
    font-size:11px; font-weight:700; color:var(--muted);
    background:var(--surface-2); border-radius:6px; padding:2px 6px;
  }
  .tag[data-cat]{ color:var(--cat-ink); background:var(--cat-soft); }
  .tag.outline[data-cat]{
    color:var(--cat-ink); background:transparent;
    border:1.5px solid var(--cat-ink); padding:1px 6px;
  }

  [data-cat="slate"]{ --cat-ink:var(--cat-slate-ink); --cat-soft:var(--cat-slate-soft); }
  [data-cat="terracotta"]{ --cat-ink:var(--cat-terracotta-ink); --cat-soft:var(--cat-terracotta-soft); }
  [data-cat="violet"]{ --cat-ink:var(--cat-violet-ink); --cat-soft:var(--cat-violet-soft); }
  [data-cat="steelblue"]{ --cat-ink:var(--cat-steelblue-ink); --cat-soft:var(--cat-steelblue-soft); }
  [data-cat="moss"]{ --cat-ink:var(--cat-moss-ink); --cat-soft:var(--cat-moss-soft); }
  [data-cat="teal"]{ --cat-ink:var(--cat-teal-ink); --cat-soft:var(--cat-teal-soft); }
  [data-cat="amber"]{ --cat-ink:var(--cat-amber-ink); --cat-soft:var(--cat-amber-soft); }
  [data-cat="rose"]{ --cat-ink:var(--cat-rose-ink); --cat-soft:var(--cat-rose-soft); }
  .row-body .text{ font-size:15px; line-height:1.42; word-break:keep-all; }

  p.empty{ margin:0; padding:6px 14px 14px; color:var(--faint); font-size:14px; }

  #status{ text-align:center; color:var(--faint); font-size:12px; padding:10px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titles">
      <span class="eyebrow" id="date-label">일정 알리미</span>
      <h1 id="title">오늘 정리</h1>
      <span class="weekday" id="weekday-label"></span>
    </div>
    <button id="refresh" aria-label="새로고침">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" />
      </svg>
    </button>
  </header>

  <main id="app">
    <p class="empty">불러오는 중…</p>
  </main>
  <div id="status"></div>
  <pre id="debug" style="margin:16px; padding:12px; background:#00000010; border-radius:8px; font-size:11px; white-space:pre-wrap; word-break:break-all;">알림 상태 확인 중…</pre>
</div>

<script>
const ICONS = {
  clock: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  check: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12.5 2.5 2.5 5-5"/></svg>',
  book: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  holiday: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.5c.35 0 .67.2.83.51l2.3 4.66 5.14.75a.93.93 0 0 1 .52 1.58l-3.72 3.63.88 5.12a.93.93 0 0 1-1.35.98L12 16.9l-4.6 2.42a.93.93 0 0 1-1.35-.98l.88-5.12-3.72-3.63a.93.93 0 0 1 .52-1.58l5.14-.75 2.3-4.66c.16-.31.48-.51.83-.51Z"/></svg>',
};

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  const { dataset, ...rest } = props;
  Object.assign(node, rest);
  if (dataset) Object.assign(node.dataset, dataset);
  children.forEach((c) => node.appendChild(c));
  return node;
}

const WORK_PALETTE = ["slate", "terracotta", "violet", "steelblue", "moss", "teal", "amber", "rose"];

function workCategory(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return WORK_PALETTE[hash % WORK_PALETTE.length];
}

function routineCategory(text) {
  if (text.includes("기상") || text.includes("취침")) return "slate";
  if (text.includes("식사")) return "terracotta";
  if (text.includes("집필")) return "violet";
  if (text.includes("작업")) return "steelblue";
  if (text === "운동") return "moss";
  if (text.includes("휴식")) return "teal";
  return null;
}

const TODO_KIND_CATEGORY = { "할일": "amber", "과제": "rose" };
const NOVEL_STAGE_CATEGORY = {
  "설정": "slate", "시놉시스": "violet", "트리트먼트": "steelblue",
  "초고": "amber", "퇴고": "terracotta", "연재": "moss",
};

function row(item, sectionType) {
  const li = el("li", { className: "row" });
  const timeText = (item.time || "").trim();
  const timeCat = sectionType === "schedule" ? routineCategory(item.text || "") : null;
  li.appendChild(el("span", {
    className: "chip-time mono" + (timeText ? "" : " empty"),
    textContent: timeText || "--",
    dataset: timeCat ? { cat: timeCat } : {},
  }));

  const body = el("div", { className: "row-body" });
  const tags = (item.tags || []).filter(Boolean);
  if (tags.length) {
    const tagsWrap = el("div", { className: "tags" });
    tags.forEach((t, i) => {
      let cat = null;
      let outline = false;
      if (sectionType === "todo") {
        cat = TODO_KIND_CATEGORY[t] || null;
      } else if (sectionType === "novel") {
        if (i === 0) { cat = workCategory(t); outline = true; }
        else { cat = NOVEL_STAGE_CATEGORY[t] || null; }
      }
      tagsWrap.appendChild(el("span", {
        className: "tag" + (outline ? " outline" : ""),
        textContent: t,
        dataset: cat ? { cat } : {},
      }));
    });
    body.appendChild(tagsWrap);
  }
  body.appendChild(el("span", { className: "text", textContent: item.text || "" }));
  li.appendChild(body);
  return li;
}

function card(iconKey, title, items, count, sectionType) {
  const section = el("section", { className: "card" });
  const head = el("div", { className: "card-head" });
  head.appendChild(el("span", { className: "icon", innerHTML: ICONS[iconKey] }));
  head.appendChild(el("h2", { textContent: title }));
  if (typeof count === "number") {
    head.appendChild(el("span", { className: "count", textContent: count + "건" }));
  }
  section.appendChild(head);

  if (items && items.length) {
    const ul = el("ul", { className: "rows" });
    items.forEach((it) => ul.appendChild(row(it, sectionType)));
    section.appendChild(ul);
  } else {
    section.appendChild(el("p", { className: "empty", textContent: "등록된 항목이 없습니다." }));
  }
  return section;
}

function render(data) {
  document.getElementById("date-label").textContent = data.date || "일정 알리미";
  document.getElementById("title").textContent = "오늘 정리";
  document.getElementById("weekday-label").textContent = data.weekday || "";

  const app = document.getElementById("app");
  app.innerHTML = "";

  if (data.holiday_names && data.holiday_names.length) {
    const banner = el("div", { className: "banner" });
    banner.innerHTML = ICONS.holiday;
    banner.appendChild(el("span", { textContent: "오늘은 공휴일입니다: " + data.holiday_names.join(", ") }));
    app.appendChild(banner);
  }

  app.appendChild(card("clock", data.schedule_title || "오늘의 일정", data.schedule_items, data.schedule_items ? data.schedule_items.length : 0, "schedule"));

  if (data.todo_items && data.todo_items.length) {
    app.appendChild(card("check", "오늘의 할일", data.todo_items, data.todo_items.length, "todo"));
  }

  app.appendChild(card("book", "오늘의 소설 일정", data.novel_items, data.novel_items ? data.novel_items.length : 0, "novel"));
}

async function loadToday(isRefresh) {
  const btn = document.getElementById("refresh");
  const statusEl = document.getElementById("status");
  if (isRefresh) btn.classList.add("spin");
  try {
    const res = await fetch("./today.json?t=" + Date.now(), { cache: "no-store" });
    const data = await res.json();
    render(data);
    statusEl.textContent = "";
  } catch (e) {
    statusEl.textContent = "새 데이터를 불러오지 못했습니다. 이전 화면을 보여드립니다.";
  } finally {
    setTimeout(() => btn.classList.remove("spin"), 600);
  }
}

document.getElementById("refresh").addEventListener("click", () => loadToday(true));
loadToday(false);

// 서비스워커 등록은 OneSignal SDK(init의 serviceWorkerPath/Param)가 전담한다.
// 여기서 따로 register()를 또 부르면 등록 타이밍이 겹칠 수 있어서 뺐다.
</script>
</body>
</html>
